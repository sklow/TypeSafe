<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jev Local Playground</title>
<style>
:root {
  --bg: #f4f3ef; --panel: #ffffff; --ink: #1f2a37; --muted: #6b7280; --line: #e3e1da;
  --accent: #2f5d62; --bar: #7aa5a8; --bar-top: #2f5d62; --track: #ecebe5;
  --auto: #2e7d4f; --auto-bg: #e4f2e9; --human: #b4531a; --human-bg: #fbece0;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 -apple-system, "Hiragino Sans", "Noto Sans JP", "Segoe UI", sans-serif; }
header { height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; border-bottom: 1px solid var(--line); background: var(--panel); }
header h1 { font-size: 16px; margin: 0; letter-spacing: .02em; }
header h1 span { color: var(--muted); font-weight: 400; margin-left: 10px; font-size: 13px; }
#meta { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
#meta b { color: var(--ink); font-weight: 600; }
main { display: grid; grid-template-columns: 380px 1fr; gap: 16px; padding: 16px 24px; height: calc(100% - 52px); min-height: 0; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-height: 0; }
.left { display: flex; flex-direction: column; gap: 10px; }
label.lbl { font-size: 12px; color: var(--muted); letter-spacing: .04em; }
select, textarea, input[type=number] { font: inherit; color: var(--ink); border: 1px solid var(--line); border-radius: 8px; background: #fbfbf9; padding: 8px 10px; width: 100%; }
textarea { flex: 1; resize: none; line-height: 1.55; min-height: 0; }
select:focus, textarea:focus, input:focus { outline: 2px solid #b9d3d4; border-color: var(--bar); }
.row { display: flex; gap: 10px; align-items: end; }
.row > div { flex: 1; }
button { font: inherit; font-weight: 600; background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 10px 18px; cursor: pointer; }
button:disabled { opacity: .55; cursor: default; }
.qlist { font-size: 12px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 8px; max-height: 120px; overflow: hidden; }
.qlist div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.qlist i { font-style: normal; display: inline-block; width: 44px; color: var(--accent); }
.right { display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: min-content; gap: 14px; align-content: start; overflow: hidden; background: transparent; border: 0; padding: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; min-height: 150px; }
.card h3 { margin: 0 0 2px; font-size: 13px; color: var(--muted); font-weight: 600; display: flex; justify-content: space-between; }
.card .q { font-weight: 600; margin-bottom: 10px; min-height: 20px; }
.tag { font-size: 11px; background: var(--track); border-radius: 4px; padding: 1px 6px; color: var(--muted); }
.bar { display: grid; grid-template-columns: 150px 1fr 44px; gap: 8px; align-items: center; margin: 4px 0; font-size: 13px; }
.bar .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar .track { height: 14px; background: var(--track); border-radius: 7px; overflow: hidden; }
.bar .fill { height: 100%; background: var(--bar); border-radius: 7px; width: 0; transition: width .6s cubic-bezier(.2,.8,.2,1); }
.bar.top .fill { background: var(--bar-top); }
.bar.top .name { font-weight: 700; }
.bar .pct { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.cols { display: flex; align-items: end; gap: 8px; height: 92px; margin: 4px 0 2px; }
.col { flex: 1; display: flex; flex-direction: column; justify-content: end; align-items: center; height: 100%; }
.col .fill { width: 100%; background: var(--bar); border-radius: 4px 4px 0 0; transition: height .6s cubic-bezier(.2,.8,.2,1); height: 0; }
.col.top .fill { background: var(--bar-top); }
.col .pc { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; margin-bottom: 2px; }
.cl { display: flex; gap: 8px; font-size: 11px; color: var(--muted); text-align: center; }
.cl div { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.big { font-size: 13px; margin-top: 6px; color: var(--muted); }
.big b { color: var(--ink); font-size: 18px; font-variant-numeric: tabular-nums; }
.gauge { height: 22px; background: var(--track); border-radius: 11px; position: relative; overflow: hidden; margin: 14px 0 6px; }
.gauge .fill { height: 100%; background: linear-gradient(90deg, #9bbfc1, var(--bar-top)); width: 0; transition: width .6s cubic-bezier(.2,.8,.2,1); }
.gauge .mid { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: rgba(0,0,0,.25); }
.gate { margin-top: 10px; display: flex; align-items: center; justify-content: space-between; font-size: 12px; padding: 6px 10px; border-radius: 8px; }
.gate.auto { background: var(--auto-bg); color: var(--auto); }
.gate.human { background: var(--human-bg); color: var(--human); }
.gate b { font-size: 13px; }
.empty { color: var(--muted); padding: 40px 0; text-align: center; grid-column: 1 / -1; }
.err { color: var(--human); grid-column: 1 / -1; background: var(--human-bg); padding: 12px; border-radius: 8px; }
</style>
</head>
<body>
<header>
  <h1>Jev Local Playground<span>型付き質問 → 較正された確率分布</span></h1>
  <div id="meta">&nbsp;</div>
</header>
<main>
  <section class="panel left">
    <label class="lbl" for="preset">プリセット</label>
    <select id="preset"></select>
    <label class="lbl" for="state">STATE（編集して再実行できます）</label>
    <textarea id="state" spellcheck="false"></textarea>
    <div class="qlist" id="qlist"></div>
    <div class="row">
      <div><label class="lbl" for="thr">自動実行のしきい値（confidence ≥）</label><input id="thr" type="number" min="0" max="1" step="0.05" value="0.8"></div>
      <button id="run">実行 (⌘/Ctrl+Enter)</button>
    </div>
  </section>
  <section class="right" id="out"><div class="empty">プリセットを選んで「実行」を押してください。</div></section>
</main>
<script>
const PRESETS = [
  { name: "日本語：問い合わせチケット",
    state: "件名：二重請求について\n本文：3月分のサブスクリプション料金が2回引き落とされています。先週メールしたのに返信がありません。今日中に対応してもらえないなら解約します。",
    questions: {
      team: { type: "choice", instructions: "このチケットはどのチームが担当すべきか", criteria: { "請求": "支払い・請求書・返金", "技術サポート": "不具合・障害・連携", "営業": "価格・プラン変更", "法務": "契約・規約・個人情報" } },
      urgency: { type: "score", instructions: "このチケットの緊急度は？", criteria: ["低い", "普通", "高い", "至急"] },
      churn: { type: "noul", instructions: "顧客は解約をほのめかしていますか" },
      refund: { type: "noul", instructions: "顧客は返金を明確に求めていますか" } } },
  { name: "English: product review",
    state: "I bought these headphones two weeks ago. The sound quality is fantastic and the battery easily lasts a whole week. However, the left ear cup started crackling yesterday, and support has not answered my message yet.",
    questions: {
      sentiment: { type: "choice", instructions: "What is the overall sentiment of this review?", criteria: { positive: null, negative: null, neutral: null, mixed: "Both clear praise and clear complaints" } },
      quality: { type: "score", instructions: "How does the reviewer rate the sound quality?", criteria: ["terrible", "poor", "okay", "good", "excellent"] },
      defect: { type: "noul", instructions: "Does the reviewer report a hardware defect?" },
      price: { type: "noul", instructions: "Does the reviewer mention the price?" } } },
  { name: "Security alert triage",
    state: { alert: "Multiple failed SSH logins followed by a successful login", source_ip: "203.0.113.54 (previously unseen, geo: unknown)", account: "svc-backup", events: ["02:13 38 failed logins in 4 minutes", "02:17 login succeeded", "02:19 new cron job created", "02:21 outbound transfer of 2.1 GB to unknown host"] },
    questions: {
      kind: { type: "choice", instructions: "What type of incident is this?", criteria: { "brute-force compromise": "Credentials guessed, then attacker access", "data exfiltration": "Data being copied out", "false positive": "Benign activity", "misconfiguration": "Internal config problem" } },
      severity: { type: "score", instructions: "How severe is this incident?", criteria: ["informational", "low", "medium", "high", "critical"] },
      isolate: { type: "noul", instructions: "Should the host be isolated from the network immediately?" },
      benign: { type: "noul", instructions: "Is this most likely benign admin activity?" } } },
  { name: "日本語：会議メモ（曖昧な例）",
    state: ["来週の定例は水曜15時の予定です。", "田中さんは出られるかもしれないと言っていましたが、確定ではありません。", "資料は木曜までに共有します。"],
    questions: {
      attend: { type: "noul", instructions: "田中さんは定例に出席しますか" },
      day: { type: "choice", instructions: "定例は何曜日か", criteria: { "月曜": null, "火曜": null, "水曜": null, "木曜": null, "金曜": null } },
      certainty: { type: "score", instructions: "出席の確度はどの程度か", criteria: ["ほぼ不参加", "どちらともいえない", "ほぼ参加"] },
      materials: { type: "noul", instructions: "資料は定例の前に共有されますか" } } },
];
const $ = (id) => document.getElementById(id);
const sel = $("preset"), stateEl = $("state");
PRESETS.forEach((p, i) => sel.add(new Option(p.name, i)));
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const pct = (p) => (p * 100).toFixed(p >= 0.995 || p < 0.005 ? 0 : 0) + "%";

function loadPreset() {
  const p = PRESETS[sel.value];
  stateEl.value = typeof p.state === "string" ? p.state : JSON.stringify(p.state, null, 2);
  const ql = $("qlist"); ql.replaceChildren();
  for (const [k, q] of Object.entries(p.questions)) { const d = el("div"); d.append(el("i", null, q.type), document.createTextNode(q.instructions)); ql.append(d); }
}
function parseState(raw, preset) {
  if (typeof preset.state !== "string") { try { return JSON.parse(raw); } catch { return raw; } }
  return raw;
}
sel.onchange = () => { loadPreset(); };

function gate(conf, thr) {
  const ok = conf >= thr, g = el("div", "gate " + (ok ? "auto" : "human"));
  g.append(el("b", null, ok ? "✓ 自動実行" : "↪ 人間に回す"), el("span", null, "confidence " + conf.toFixed(2) + (ok ? " ≥ " : " < ") + thr));
  return g;
}
function card(key, q, a, thr) {
  const c = el("div", "card");
  const h = el("h3"); h.append(el("span", null, key), el("span", "tag", q.type)); c.append(h, el("div", "q", q.instructions));
  let conf;
  if (q.type === "choice") {
    const entries = Object.entries(a.probabilities).sort((x, y) => y[1] - x[1]);
    for (const [name, p] of entries) {
      const b = el("div", "bar" + (name === a.choice ? " top" : "")), tr = el("div", "track"), f = el("div", "fill");
      tr.append(f); b.append(el("div", "name", name), tr, el("div", "pct", pct(p))); c.append(b);
      requestAnimationFrame(() => requestAnimationFrame(() => (f.style.width = p * 100 + "%")));
    }
    conf = a.confidence;
  } else if (q.type === "score") {
    const probs = Object.values(a.probabilities), top = probs.indexOf(Math.max(...probs));
    const cols = el("div", "cols"), labs = el("div", "cl");
    probs.forEach((p, i) => {
      const col = el("div", "col" + (i === top ? " top" : "")), f = el("div", "fill");
      col.append(el("div", "pc", pct(p)), f); cols.append(col); labs.append(el("div", null, i + " " + q.criteria[i]));
      requestAnimationFrame(() => requestAnimationFrame(() => (f.style.height = Math.max(p * 70, p > 0 ? 2 : 0) + "px")));
    });
    c.append(cols, labs);
    const big = el("div", "big"); big.append(document.createTextNode("期待値 "), el("b", null, a.score.toFixed(2))); c.append(big);
    conf = a.confidence;
  } else {
    const gz = el("div", "gauge"), f = el("div", "fill"); gz.append(f, el("div", "mid")); c.append(gz);
    requestAnimationFrame(() => requestAnimationFrame(() => (f.style.width = a.noul * 100 + "%")));
    const big = el("div", "big"); big.append(document.createTextNode("P(yes) "), el("b", null, pct(a.noul)), document.createTextNode("   → " + (a.noul >= 0.5 ? "yes" : "no"))); c.append(big);
    conf = Math.abs(2 * a.noul - 1); // noul に confidence は無い。|2p-1| を代用
  }
  c.append(gate(conf, thr));
  return c;
}

async function run() {
  const preset = PRESETS[sel.value], btn = $("run"), out = $("out");
  const thr = Number($("thr").value) || 0.8;
  btn.disabled = true; btn.textContent = "実行中…";
  try {
    const t0 = performance.now();
    const res = await fetch("/v1/systemone", { method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ state: parseState(stateEl.value, preset), questions: preset.questions }) });
    const j = await res.json(); const rtt = Math.round(performance.now() - t0);
    out.replaceChildren();
    if (!res.ok) { out.append(el("div", "err", "エラー: " + (j.error || res.status))); return; }
    for (const [k, q] of Object.entries(preset.questions)) out.append(card(k, q, j.answers[k], thr));
    const m = $("meta"); m.replaceChildren(document.createTextNode("model "), el("b", null, j.model), document.createTextNode("   latency "), el("b", null, j.x_debug.latency_ms + " ms"), document.createTextNode("   (round trip " + rtt + " ms)"));
  } catch (e) { out.replaceChildren(el("div", "err", "通信エラー: " + e.message)); }
  finally { btn.disabled = false; btn.textContent = "実行 (⌘/Ctrl+Enter)"; }
}
$("run").onclick = run;
document.addEventListener("keydown", (e) => { if ((e.metaKey || e.ctrlKey) && e.key === "Enter") run(); });
loadPreset();
</script>
</body>
</html>
